<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGestor — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0A0A0F;
    --surface: #111118;
    --card:    #16161F;
    --border:  #1E1E2E;
    --border2: #2A2A3C;
    --text:    #F1F1F5;
    --muted:   #6B6B80;
    --dim:     #3A3A50;
    --accent:  #6366F1;
    --accent2: #818CF8;
    --green:   #10B981;
    --amber:   #F59E0B;
    --red:     #EF4444;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /*
    BACKGROUND DECORATIVO
    ───────────────────────
    Dois círculos grandes, desfocados, com a cor de accent/green
    em baixa opacidade — dão profundidade ao fundo escuro sem
    distrair do formulário. Posicionados fora da área central.
  */
  .bg-glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow.one {
    width: 480px; height: 480px;
    background: var(--accent);
    opacity: 0.12;
    top: -120px; left: -120px;
  }
  .bg-glow.two {
    width: 420px; height: 420px;
    background: var(--green);
    opacity: 0.08;
    bottom: -100px; right: -100px;
  }

  /* ── CONTAINER PRINCIPAL ── */
  .auth-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand-icon {
    width: 52px;
    height: 52px;
    background: var(--accent);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  }
  .brand-name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  /* ── TOGGLE LOGIN / CADASTRO ── */
  .auth-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 11px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .auth-toggle button {
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .auth-toggle button.active {
    background: var(--accent);
    color: #fff;
  }

  /* ── CAMPOS ── */
  .field { margin-bottom: 14px; position: relative; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
  }
  .field input::placeholder { color: var(--dim); }

  .field-error {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: var(--red);
  }
  .field-error.show { display: block; }

  /* Botão de mostrar/ocultar senha — ícone dentro do campo */
  .field.password-field input { padding-right: 42px; }
  .toggle-password {
    position: absolute;
    right: 12px;
    top: 33px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 4px;
    line-height: 1;
  }
  .toggle-password:hover { color: var(--text); }

  /* ── FORÇA DA SENHA (só aparece no cadastro) ── */
  .strength-wrap {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .strength-wrap.show { display: flex; }
  .strength-bars {
    display: flex;
    gap: 4px;
    flex: 1;
  }
  .strength-bar {
    height: 4px;
    flex: 1;
    border-radius: 99px;
    background: var(--border2);
    transition: background 0.2s;
  }
  .strength-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    min-width: 52px;
    text-align: right;
  }

  /* ── BOTÃO PRINCIPAL ── */
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
    margin-top: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-submit:hover { filter: brightness(1.1); }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Spinner de carregamento dentro do botão, durante o fetch */
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MENSAGEM DE ERRO ── */
  .auth-error {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 9px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--red);
  }
  .auth-error.show { display: flex; }

  .auth-info {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 9px;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--amber);
  }
  .auth-info.show { display: flex; }

  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: var(--muted);
  }

  .auth-link {
    margin-top: 10px;
    text-align: right;
  }
  .auth-link button {
    background: none;
    border: none;
    color: var(--accent2);
    cursor: pointer;
    font-size: 12px;
    text-decoration: underline;
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal-card {
    width: 100%;
    max-width: 430px;
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 20px;
  }
  .modal-title {
    font-size: 18px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .modal-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .btn-secondary {
    flex: 1;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    border-radius: 10px;
    padding: 11px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>

<div class="auth-wrap">

  <div class="brand">
    <div class="brand-icon">💼</div>
    <div class="brand-name">AutoGestor</div>
    <div class="brand-sub">Controle financeiro pessoal</div>
  </div>

  <div class="auth-card">

    <!-- Toggle Entrar / Criar conta -->
    <div class="auth-toggle">
      <button type="button" class="active" id="tab-login" onclick="trocarAba('login')">Entrar</button>
      <button type="button" id="tab-cadastro" onclick="trocarAba('cadastro')">Criar conta</button>
    </div>

    <!-- Mensagem de erro genérica, reaproveitada pelos dois formulários -->
    <div class="auth-error" id="auth-error">
      <span>⚠</span>
      <span id="auth-error-text">Erro</span>
    </div>
    <div class="auth-info" id="auth-info">
      <span>⏳</span>
      <span id="auth-info-text">Aguarde...</span>
    </div>

    <!-- ═══════════════ FORMULÁRIO DE LOGIN ═══════════════ -->
    <form id="form-login" onsubmit="return false;">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field password-field">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar senha" onclick="alternarSenha('login-senha', this)">👁</button>
      </div>

      <div class="auth-link">
        <button type="button" onclick="abrirModalRecuperacao()">Esqueci minha senha</button>
      </div>

      <button type="button" class="btn-submit" id="btn-login" onclick="fazerLogin()">
        <span class="spinner" id="spinner-login"></span>
        <span id="btn-login-text">Entrar</span>
      </button>
    </form>

    <!-- ═══════════════ FORMULÁRIO DE CADASTRO ═══════════════ -->
    <form id="form-cadastro" style="display:none;" onsubmit="return false;">
      <div class="field">
        <label>Nome</label>
        <input type="text" id="cad-nome" placeholder="Seu nome completo" autocomplete="name">
      </div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="cad-email" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field password-field">
        <label>Senha</label>
        <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" oninput="atualizarForcaSenha(this.value)">
        <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar senha" onclick="alternarSenha('cad-senha', this)">👁</button>

        <!-- Indicador de força da senha — aparece ao digitar -->
        <div class="strength-wrap" id="strength-wrap">
          <div class="strength-bars">
            <div class="strength-bar" id="bar-1"></div>
            <div class="strength-bar" id="bar-2"></div>
            <div class="strength-bar" id="bar-3"></div>
          </div>
          <span class="strength-label" id="strength-label">Fraca</span>
        </div>
      </div>

      <div class="field password-field">
        <label for="cad-confirmar-senha">Confirmar senha</label>
        <input type="password" id="cad-confirmar-senha" autocomplete="new-password" placeholder="Repita sua senha" oninput="validarConfirmacaoSenha()">
        <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar confirmacao de senha" onclick="alternarSenha('cad-confirmar-senha', this)">👁</button>
        <span class="field-error" id="cad-confirmar-erro" role="alert">As senhas não coincidem.</span>
      </div>

      <button type="button" class="btn-submit" id="btn-cadastro" onclick="fazerCadastro()">
        <span class="spinner" id="spinner-cadastro"></span>
        <span id="btn-cadastro-text">Criar conta</span>
      </button>
    </form>

  </div>

  <div class="auth-footer">
    AutoGestor © 2026 — seus dados ficam só com você
  </div>

</div>

<div class="modal-backdrop" id="modal-recuperacao" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-recuperacao-title">
    <div class="modal-title" id="modal-recuperacao-title">Recuperar senha</div>
    <div class="modal-sub">Informe seu e-mail. Se existir uma conta, enviaremos as instruções de redefinição.</div>
    <div class="field">
      <label for="rec-email">E-mail</label>
      <input type="email" id="rec-email" autocomplete="email" placeholder="seu@email.com">
    </div>
    <div class="auth-info" id="rec-info">
      <span>ℹ</span>
      <span id="rec-info-text"></span>
    </div>
    <div class="auth-error" id="rec-erro">
      <span>⚠</span>
      <span id="rec-erro-text"></span>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="fecharModalRecuperacao()">Voltar ao login</button>
      <button type="button" class="btn-submit" id="btn-recuperar" onclick="enviarRecuperacaoSenha()">
        <span class="spinner" id="spinner-recuperar"></span>
        <span id="btn-recuperar-text">Enviar link de recuperação</span>
      </button>
    </div>
  </div>
</div>

<script>
/*
  URL DA API — mesma lógica do dashboard principal:
  usa window.location.origin para funcionar automaticamente
  em qualquer ambiente (localhost, rede local, ngrok), desde
  que esta página seja servida PELA PRÓPRIA API
  (ex: app/static/login.html).
*/
const API_BASE = window.location.origin;
const REQUEST_TIMEOUT_MS = 15000;
const SLOW_REQUEST_NOTICE_MS = 4000;

/*
  trocarAba(aba)
  ─────────────────
  Alterna visualmente entre os formulários de Login e Cadastro.
  Também limpa qualquer mensagem de erro visível, para não
  mostrar um erro do login enquanto o usuário preenche o cadastro.
*/
function trocarAba(aba) {
  const isLogin = aba === 'login';

  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-cadastro').classList.toggle('active', !isLogin);
  document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
  document.getElementById('form-cadastro').style.display = isLogin ? 'none' : 'block';

  esconderErro();
  esconderInfo();
}

function mostrarErro(mensagem) {
  document.getElementById('auth-error-text').textContent = mensagem;
  document.getElementById('auth-error').classList.add('show');
}
function esconderErro() {
  document.getElementById('auth-error').classList.remove('show');
}

function mostrarInfo(mensagem) {
  document.getElementById('auth-info-text').textContent = mensagem;
  document.getElementById('auth-info').classList.add('show');
}

function esconderInfo() {
  document.getElementById('auth-info').classList.remove('show');
}

function abrirModalRecuperacao() {
  document.getElementById('modal-recuperacao').classList.add('show');
  document.getElementById('modal-recuperacao').setAttribute('aria-hidden', 'false');
  esconderErroRecuperacao();
  esconderInfoRecuperacao();
}

function fecharModalRecuperacao() {
  document.getElementById('modal-recuperacao').classList.remove('show');
  document.getElementById('modal-recuperacao').setAttribute('aria-hidden', 'true');
}

function mostrarErroRecuperacao(mensagem) {
  document.getElementById('rec-erro-text').textContent = mensagem;
  document.getElementById('rec-erro').classList.add('show');
}

function esconderErroRecuperacao() {
  document.getElementById('rec-erro').classList.remove('show');
}

function mostrarInfoRecuperacao(mensagem) {
  document.getElementById('rec-info-text').textContent = mensagem;
  document.getElementById('rec-info').classList.add('show');
}

function esconderInfoRecuperacao() {
  document.getElementById('rec-info').classList.remove('show');
}

function validarConfirmacaoSenha() {
  const senha = document.getElementById('cad-senha').value;
  const confirmar = document.getElementById('cad-confirmar-senha').value;
  const erro = document.getElementById('cad-confirmar-erro');

  if (!confirmar) {
    erro.classList.remove('show');
    return true;
  }

  if (senha !== confirmar) {
    erro.classList.add('show');
    return false;
  }

  erro.classList.remove('show');
  return true;
}

async function enviarRecuperacaoSenha() {
  esconderErroRecuperacao();
  esconderInfoRecuperacao();
  const email = document.getElementById('rec-email').value.trim();
  if (!email) {
    mostrarErroRecuperacao('Preencha o e-mail.');
    return;
  }

  setCarregando('btn-recuperar', 'spinner-recuperar', 'btn-recuperar-text', true, 'Enviar link de recuperação');
  try {
    const res = await fetchComTimeout(`${API_BASE}/auth/esqueci-senha`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    }, REQUEST_TIMEOUT_MS, () => {
      mostrarInfoRecuperacao('O servidor está levando mais tempo que o normal...');
    });

    if (!res.ok && res.status === 429) {
      mostrarErroRecuperacao('Muitas tentativas. Aguarde alguns minutos e tente novamente.');
      return;
    }

    mostrarInfoRecuperacao('Se existir uma conta com este e-mail, enviaremos as instruções para redefinir sua senha.');
  } catch (e) {
    if (e.name === 'AbortError') {
      mostrarErroRecuperacao('Tempo limite excedido. Tente novamente em instantes.');
    } else {
      mostrarErroRecuperacao('Erro ao solicitar recuperação de senha.');
    }
  } finally {
    setCarregando('btn-recuperar', 'spinner-recuperar', 'btn-recuperar-text', false, 'Enviar link de recuperação');
  }
}

async function fetchComTimeout(url, options, timeoutMs, onSlow) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
  const slowId = setTimeout(() => {
    if (typeof onSlow === 'function') onSlow();
  }, SLOW_REQUEST_NOTICE_MS);

  try {
    return await fetch(url, {
      ...options,
      signal: controller.signal,
    });
  } finally {
    clearTimeout(timeoutId);
    clearTimeout(slowId);
  }
}

/*
  alternarSenha(idCampo, botao)
  ────────────────────────────────
  Alterna o type do input entre 'password' e 'text', e troca
  o ícone do olho para indicar o estado atual.
*/
function alternarSenha(idCampo, botao) {
  const campo = document.getElementById(idCampo);
  const oculto = campo.type === 'password';
  campo.type = oculto ? 'text' : 'password';
  botao.textContent = oculto ? '🙈' : '👁';
}

/*
  atualizarForcaSenha(senha)
  ─────────────────────────────
  Indicador visual simples de força de senha, baseado em:
  comprimento, presença de números e presença de caractere especial.
  Não é uma análise criptográfica séria — é só feedback de UX
  para incentivar senhas melhores.
*/
function atualizarForcaSenha(senha) {
  const wrap = document.getElementById('strength-wrap');

  if (!senha) {
    wrap.classList.remove('show');
    return;
  }
  wrap.classList.add('show');

  let pontos = 0;
  if (senha.length >= 6) pontos++;
  if (senha.length >= 10 && /[0-9]/.test(senha)) pontos++;
  if (/[^a-zA-Z0-9]/.test(senha) || (senha.length >= 12)) pontos++;

  const bars = [document.getElementById('bar-1'), document.getElementById('bar-2'), document.getElementById('bar-3')];
  const cores = ['var(--red)', 'var(--amber)', 'var(--green)'];
  const labels = ['Fraca', 'Média', 'Forte'];

  bars.forEach((bar, i) => {
    bar.style.background = i < pontos ? cores[pontos - 1] : 'var(--border2)';
  });

  document.getElementById('strength-label').textContent = labels[Math.max(pontos - 1, 0)];
  document.getElementById('strength-label').style.color = cores[Math.max(pontos - 1, 0)];
}

/*
  salvarSessao(resposta)
  ──────────────────────────
  Guarda o token JWT e os dados do usuário no localStorage.
  O dashboard principal (autogestor.html) vai ler essa mesma
  chave para saber se o usuário está logado e montar o header
  Authorization em cada requisição.
*/
function salvarSessao(resposta) {
  localStorage.setItem('autogestor_token', resposta.access_token);
  localStorage.setItem('autogestor_usuario', JSON.stringify(resposta.usuario));
}

function redirecionarAposLogin() {
  const destino = localStorage.getItem('autogestor_return_to');
  localStorage.removeItem('autogestor_return_to');
  if (destino && destino.startsWith('/')) {
    window.location.href = destino;
    return;
  }
  window.location.href = 'index.html';
}

/*
  setCarregando(botaoId, spinnerId, textoId, carregando, textoOriginal)
  ─────────────────────────────────────────────────────────────────────
  Liga/desliga o estado de loading visual do botão: desabilita,
  mostra o spinner, troca o texto.
*/
function setCarregando(botaoId, spinnerId, textoId, carregando, textoOriginal) {
  document.getElementById(botaoId).disabled = carregando;
  document.getElementById(spinnerId).classList.toggle('show', carregando);
  document.getElementById(textoId).textContent = carregando ? 'Aguarde…' : textoOriginal;
}

/*
  fazerLogin()
  ──────────────
  Envia email+senha para POST /auth/login.
  Se a API responder com erro (401 = credenciais inválidas),
  mostra a mensagem retornada. Se der certo, salva a sessão e
  redireciona para o dashboard.
*/
async function fazerLogin() {
  esconderErro();
  esconderInfo();

  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;

  if (!email || !senha) {
    mostrarErro('Preencha e-mail e senha.');
    return;
  }

  setCarregando('btn-login', 'spinner-login', 'btn-login-text', true, 'Entrar');

  try {
    const res = await fetchComTimeout(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha }),
    }, REQUEST_TIMEOUT_MS, () => {
      mostrarInfo('O servidor está levando mais tempo que o normal...');
    });

    const corpo = await res.json();

    if (!res.ok) {
      // FastAPI/Pydantic normalmente retorna o erro em `detail`
      mostrarErro(corpo.detail || 'E-mail ou senha incorretos.');
      return;
    }

    salvarSessao(corpo);
    redirecionarAposLogin();

  } catch (e) {
    if (e.name === 'AbortError') {
      mostrarErro('Tempo limite excedido ao autenticar. Tente novamente em instantes.');
    } else {
      mostrarErro('Erro ao conectar com a API. Verifique se o servidor está rodando.');
    }
    console.error('Erro de rede no login:', e);
  } finally {
    esconderInfo();
    setCarregando('btn-login', 'spinner-login', 'btn-login-text', false, 'Entrar');
  }
}

/*
  fazerCadastro()
  ──────────────────
  Envia nome+email+senha para POST /auth/cadastro.
  A API já retorna um token (login automático após cadastro),
  então o fluxo é igual ao login: salva sessão e redireciona.
*/
async function fazerCadastro() {
  esconderErro();
  esconderInfo();

  const nome  = document.getElementById('cad-nome').value.trim();
  const email = document.getElementById('cad-email').value.trim();
  const senha = document.getElementById('cad-senha').value;
  const confirmarSenha = document.getElementById('cad-confirmar-senha').value;

  if (!nome || !email || !senha) {
    mostrarErro('Preencha todos os campos.');
    return;
  }
  if (senha.length < 6) {
    mostrarErro('A senha precisa ter pelo menos 6 caracteres.');
    return;
  }
  if (!confirmarSenha || senha !== confirmarSenha) {
    validarConfirmacaoSenha();
    mostrarErro('As senhas não coincidem.');
    return;
  }

  setCarregando('btn-cadastro', 'spinner-cadastro', 'btn-cadastro-text', true, 'Criar conta');
  document.getElementById('btn-cadastro-text').textContent = 'Criando sua conta...';

  try {
    const res = await fetchComTimeout(`${API_BASE}/auth/cadastro`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome, email, senha }),
    }, REQUEST_TIMEOUT_MS, () => {
      mostrarInfo('O servidor está levando mais tempo que o normal...');
    });

    const corpo = await res.json();

    if (!res.ok) {
      // Erro de validação do Pydantic vem como array em alguns casos
      let mensagem = corpo.detail || 'Não foi possível criar a conta.';
      if (Array.isArray(mensagem)) {
        mensagem = mensagem.map(d => d.msg).join(', ');
      }
      if (res.status === 503) {
        mensagem = 'Serviço temporariamente indisponível. Tente novamente em instantes.';
      }
      mostrarErro(mensagem);
      return;
    }

    salvarSessao(corpo);
    redirecionarAposLogin();

  } catch (e) {
    if (e.name === 'AbortError') {
      mostrarErro('Tempo limite excedido ao criar conta. Tente novamente em instantes.');
    } else {
      mostrarErro('Erro ao conectar com a API. Verifique se o servidor está rodando.');
    }
    console.error('Erro de rede no cadastro:', e);
  } finally {
    esconderInfo();
    setCarregando('btn-cadastro', 'spinner-cadastro', 'btn-cadastro-text', false, 'Criar conta');
  }
}

// Permite enviar o formulário de login apertando Enter no campo de senha
document.getElementById('login-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});
document.getElementById('cad-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerCadastro();
});
document.getElementById('cad-confirmar-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerCadastro();
});

/*
  Se o usuário já tem um token válido salvo, redireciona
  direto para o dashboard — evita mostrar a tela de login
  para quem já está autenticado.

  NOTA: isso não valida o token contra a API (não checa se
  expirou), só checa se existe. A validação real acontece
  quando o dashboard tenta usar o token numa requisição —
  se tiver expirado, a API retorna 401 e o dashboard deve
  redirecionar de volta pra cá (ver instruções no chat).
*/
if (localStorage.getItem('autogestor_token')) {
  redirecionarAposLogin();
}
</script>
