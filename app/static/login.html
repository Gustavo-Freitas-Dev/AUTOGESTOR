<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login - AutoGestor</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .login-box {
        background: #1e293b;
        padding: 30px;
        border-radius: 16px;
        width: 350px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
        text-align: center;
    }

    h1 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        border: none;
        background: #334155;
        color: white;
    }

    input::placeholder {
        color: #94a3b8;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #16a34a;
    }

    .erro {
        color: #ef4444;
        margin-top: 10px;
        display: none;
    }
</style>
</head>

<body>

<div class="login-box">
    <h1>🔐 AutoGestor</h1>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="login()">Entrar</button>

    <div class="erro" id="erro">Usuário ou senha inválidos</div>
</div>

<script>
async function login() {
    const usuario = document.getElementById('usuario').value;
    const senha = document.getElementById('senha').value;

    const res = await fetch('http://127.0.0.1:8000/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ usuario, senha })
    });

    if (res.status === 200) {
        const data = await res.json();

        // salva token (simulação)
        localStorage.setItem('token', data.token);

        window.location.href = "index.html";
    } else {
        document.getElementById('erro').style.display = 'block';
    }
}
</script>

</body>
</html>
